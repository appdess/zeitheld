name: Bug report
description: Report a reproducible ZeitHeld problem without sensitive data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. GitHub issues are public. Never include API keys, child data, recordings, transcripts, or unredacted provider responses. Report vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 1.0.0 (2) or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - iPhone Simulator
        - iPad Simulator
        - Physical iPhone
        - Physical iPad
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open …\n2. Tap …\n3. Observe …"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, child data, recordings, transcripts, and private generated content.
          required: true
