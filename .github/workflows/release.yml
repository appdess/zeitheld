name: Simulator Release
run-name: Simulator Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact app release tag, for example v1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: Verify version, current main, and deterministic suite
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      WATCHLEARN_RUN_LIVE_REALTIME: "0"
      WATCHLEARN_RUN_LIVE_HERO: "0"
      WATCHLEARN_RUN_AUDIO_ENGINE_SMOKE: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a matching version from current main
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected="v$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          test "$RELEASE_TAG" = "$expected"
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Install pinned XcodeGen
        run: |
          ./Scripts/install-xcodegen.sh
          echo "$PWD/.tools/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify source and generated project
        run: |
          ./Scripts/security-check.sh
          ./Scripts/test-release-guards.sh
          xcodegen generate
          git diff --exit-code -- WatchLearn.xcodeproj
          test -z "$(git status --porcelain --untracked-files=all -- WatchLearn.xcodeproj)"

      - name: Run complete deterministic suite
        run: |
          xcodebuild test \
            -project WatchLearn.xcodeproj \
            -scheme WatchLearn \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -parallel-testing-enabled NO

      - name: Verify signed Release Keychain access and persistence
        run: |
          xcodebuild test \
            -project WatchLearn.xcodeproj \
            -scheme WatchLearn \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
            -derivedDataPath "$RUNNER_TEMP/SignedReleaseKeychainData" \
            -parallel-testing-enabled NO \
            ENABLE_TESTABILITY=YES \
            -only-testing:WatchLearnTests/KeychainPreferencesTests/testRealKeychainSurvivesStoreRecreationAndDeletesOnlyItsOwnItem

      - name: Require green CI and CodeQL for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in ci.yml codeql.yml; do
            conclusion="$(
              gh api \
                "repos/${GH_REPO}/actions/workflows/${workflow}/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=20" \
                --jq '[.workflow_runs[] | select(.event == "push")][0].conclusion // ""'
            )"
            if [[ "$conclusion" != "success" ]]; then
              echo "${workflow} has no successful push run for ${GITHUB_SHA}." >&2
              exit 1
            fi
          done

  build:
    name: Build Simulator release bundle
    needs: verify
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned XcodeGen
        run: |
          ./Scripts/install-xcodegen.sh
          echo "$PWD/.tools/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Build signed ARM64 Simulator app
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/ReleaseDerivedData"
          output_dir="$RUNNER_TEMP/zeitheld-release-output"
          test ! -e "$output_dir"
          mkdir "$output_dir"
          xcodebuild build \
            -project WatchLearn.xcodeproj \
            -scheme WatchLearn \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO
          app="$derived/Build/Products/Release-iphonesimulator/ZeitHeld.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          test "$(defaults read "$app/Info" CFBundleIdentifier)" = \
            "com.dessdynamics.watchlearn"
          signature_details="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -Fq 'Signature=adhoc' <<< "$signature_details"
          ./Scripts/verify-release-binary.sh "$app/ZeitHeld"
          artifact_name="ZeitHeld-${RELEASE_TAG}-Simulator-arm64.zip"
          artifact="$output_dir/$artifact_name"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"
          (
            cd "$output_dir"
            shasum -a 256 "$artifact_name" > "${artifact_name}.sha256"
          )

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zeitheld-release-output/ZeitHeld-${{ inputs.tag }}-Simulator-arm64.zip
            ${{ runner.temp }}/zeitheld-release-output/ZeitHeld-${{ inputs.tag }}-Simulator-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulator-release-${{ github.run_id }}
          path: dist

      - name: Verify exact release payload
        run: |
          set -euo pipefail
          artifact_name="ZeitHeld-${RELEASE_TAG}-Simulator-arm64.zip"
          mapfile -t payload < <(find dist -type f -print | LC_ALL=C sort)
          test "${#payload[@]}" -eq 2
          test "${payload[0]}" = "dist/$artifact_name"
          test "${payload[1]}" = "dist/${artifact_name}.sha256"
          (
            cd dist
            shasum -a 256 -c "${artifact_name}.sha256"
          )

      - name: Attest release files
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/ZeitHeld-${{ inputs.tag }}-Simulator-arm64.zip
            dist/ZeitHeld-${{ inputs.tag }}-Simulator-arm64.zip.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          expected_binding="commit"$'\t'"$GITHUB_SHA"
          main_binding="$(
            gh api "repos/${GH_REPO}/git/ref/heads/main" \
              --jq '.object | [.type, .sha] | @tsv'
          )"
          if [[ "$main_binding" != "$expected_binding" ]]; then
            echo "Main advanced after verification; start a fresh release run." >&2
            exit 1
          fi

          tag_api="repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}"
          if created_binding="$(
            gh api --method POST \
              "repos/${GH_REPO}/git/refs" \
              --raw-field ref="refs/tags/${RELEASE_TAG}" \
              --raw-field sha="$GITHUB_SHA" \
              --jq '.object | [.type, .sha] | @tsv' \
              2>/dev/null
          )"; then
            test "$created_binding" = "$expected_binding"
          else
            remote_binding="$(
              gh api "$tag_api" --jq '.object | [.type, .sha] | @tsv'
            )"
            if [[ "$remote_binding" != "$expected_binding" ]]; then
              echo "Existing release tag does not resolve to the verified commit." >&2
              exit 1
            fi
          fi

          # Re-assert the verified commit binding in the final privileged step.
          # A hosted v* tag ruleset and immutable releases are required gates;
          # do not treat either as active until its GitHub setting is read back.
          rebound_sha="$(
            gh api --method PATCH \
              "repos/${GH_REPO}/git/refs/tags/${RELEASE_TAG}" \
              --raw-field sha="$GITHUB_SHA" \
              --field force=true \
              --jq 'select(.object.type == "commit") | .object.sha'
          )"
          test "$rebound_sha" = "$GITHUB_SHA"

          artifact_name="ZeitHeld-${RELEASE_TAG}-Simulator-arm64.zip"
          gh release create "$RELEASE_TAG" \
            "dist/$artifact_name" "dist/${artifact_name}.sha256" \
            --verify-tag \
            --generate-notes \
            --notes "Ad-hoc signed ARM64 iOS Simulator build with verified Keychain persistence. This cannot be installed on a physical iPhone."
