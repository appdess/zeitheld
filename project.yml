name: WatchLearn

options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 152.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.9.0

targets:
  WatchLearn:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: WebRTC
        product: WebRTC
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
    entitlements:
      path: WatchLearn/Resources/WatchLearn.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    sources:
      - path: WatchLearn
        excludes:
          - "**/.DS_Store"
      - path: PRIVACY.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dessdynamics.watchlearn
        PRODUCT_NAME: ZeitHeld
        PRODUCT_MODULE_NAME: WatchLearn
        CURRENT_PROJECT_VERSION: 19
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: WatchLearn/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - WatchLearnTests
        - WatchLearnUITests

  WatchLearnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WatchLearnTests
    dependencies:
      - target: WatchLearn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dessdynamics.watchlearn.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZeitHeld.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ZeitHeld"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WatchLearnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WatchLearnUITests
    dependencies:
      - target: WatchLearn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dessdynamics.watchlearn.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WatchLearn
